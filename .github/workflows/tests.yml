name: 艇王 PHPUnitテスト

# PR時に主要ロジック(Harville確率計算・買い目生成・傾斜配分・清算)の
# 単体テストを実行する。main への push 時は deploy.yml 側の test ジョブが
# 実行するため、ここでは重複を避けて pull_request のみをトリガーにしている。
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Composerキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-

      - name: Composer install
        run: composer install --no-progress --prefer-dist

      - name: PHPUnit実行
        run: vendor/bin/phpunit
