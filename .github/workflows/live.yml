name: 艇王 直前情報・オッズ更新

on:
  schedule:
    # GitHub Actions の cron は実際には4〜5時間に1回しか発火しない(throttling)。
    # 10分間隔はcron-job.orgから workflow_dispatch で外部トリガーする形で補完している。
    # このscheduleは外部トリガーが停止した場合の保険として残す。
    - cron: '*/10 23-23,0-12 * * *'
  workflow_dispatch:

# 外部cronから10分ごとに叩かれる場合の同時実行制御。
# 前のrunが15分以内に完了しないケースでは新runが古いrunをキャンセルして起動する。
# import_beforeinfo.php はCOALESCE UPDATEで冪等なので中断されても安全。
concurrency:
  group: live-scrape
  cancel-in-progress: true

jobs:
  scrape_live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: 直前情報・オッズ取得
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL_BEFOREINFO }}
          API_ODDS: ${{ secrets.API_URL_ODDS }}
          API_PENDING: ${{ secrets.API_URL_PENDING }}
        run: python scrape_live.py

  # [2026-11-05] 締切が近いレースの予想・買い目を締切前に生成する(閲覧の有無に関係なく)。
  # 以前は閲覧されたレースしか締切前に買い目が作られず、10月は93%のレースが結果取込み前の
  # 夜バッチ(締切後)で初めて生成されていた。scrape_live と並列に動かし、時間予算を分ける。
  # 締切後は保存済みの予想・買い目を上書きしない(prediction_guard_lib.php)ので、
  # 夜バッチは締切前に作れなかったレースの補完だけになる。
  pregenerate_upcoming:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # 生成の直前にそのレースの3連単オッズも取得する(scrape_live.py の関数を流用)
      - name: 締切前の予想・買い目生成
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_PENDING: ${{ secrets.API_URL_PENDING }}
          API_ODDS: ${{ secrets.API_URL_ODDS }}
        run: python pregenerate_upcoming.py
