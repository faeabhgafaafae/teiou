name: 艇王 直前情報・オッズ更新

on:
  schedule:
    # GitHub Actions の cron は実際には4〜5時間に1回しか発火しない(throttling)。
    # 10分間隔はcron-job.orgから workflow_dispatch で外部トリガーする形で補完している。
    # このscheduleは外部トリガーが停止した場合の保険として残す。
    - cron: '*/10 23-23,0-12 * * *'
  workflow_dispatch:

# 外部cronから10分ごとに叩かれる場合の同時実行制御。
# 前のrunが15分以内に完了しないケースでは新runが古いrunをキャンセルして起動する。
# import_beforeinfo.php はCOALESCE UPDATEで冪等なので中断されても安全。
concurrency:
  group: live-scrape
  cancel-in-progress: true

jobs:
  scrape_live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: 直前情報・オッズ取得
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_URL: ${{ secrets.API_URL_BEFOREINFO }}
          API_ODDS: ${{ secrets.API_URL_ODDS }}
          API_PENDING: ${{ secrets.API_URL_PENDING }}
        run: python scrape_live.py
