name: 艇王 自動データ取得

on:
  schedule:
    - cron: '0 22 * * *'   # JST 7:00 出走表・直前情報取得
    - cron: '0 5 * * *'    # JST 14:00 オッズ2回目取得(夕方以降のレース分の取りこぼし対策)
    - cron: '0 11 * * *'   # JST 20:00 競走成績取得(前日分)
    - cron: '30 12 * * *'  # JST 21:30 競走成績速報取得(当日分)
  workflow_dispatch:        # 手動実行も可能
    inputs:
      target_date:
        description: '対象日 (YYYY-MM-DD). 指定時は fetch_results のみ実行。省略時は全ジョブ実行。'
        required: false
        default: ''
      test_evening_odds:
        description: '夕方オッズ取得ジョブ(scrape_odds_evening_a/b)を手動テスト実行する場合はtrue'
        required: false
        default: 'false'

jobs:
  # ─── 毎朝7時: 出走表・直前情報取得 ───────────────────
  # 当日全オッズ取得は別ジョブに分離(scrape_odds_a / scrape_odds_b)。
  # 同一ジョブ内で直列実行すると、出走表・直前情報だけで70分前後を
  # 使い切ってしまい、オッズ取得がtimeout-minutesの残り時間しか
  # もらえず毎回打ち切られていたため(2026-07-13〜14に連日発生)。
  scrape_beforeinfo:
    if: >-
      github.event.schedule == '0 22 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_date == '')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: 出走表スクレイピング
        env:
          API_URL_RACELIST: ${{ secrets.API_URL_RACELIST }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python scrape_racelist.py

      - name: 直前情報スクレイピング
        env:
          API_URL: ${{ secrets.API_URL_BEFOREINFO }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python scrape_boatrace.py

  # ─── scrape_beforeinfoの直後: 当日全オッズ取得 (1/3: JCD 01〜08) ────────
  # evening_bが90分タイムアウトで失敗し続けていたため2分割→3分割に変更。
  # 各ジョブ約52レース×53秒=46分でtimeout-minutes: 90に十分収まる見込み。
  scrape_odds_a:
    needs: scrape_beforeinfo
    if: >-
      github.event.schedule == '0 22 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_date == '')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: 当日全オッズ取得 (JCD 01〜08)
        env:
          API_PENDING: ${{ secrets.API_PENDING }}
          API_ODDS: ${{ secrets.API_URL_ODDS }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python scrape_odds_all.py --jcd-min 01 --jcd-max 08

  # ─── scrape_beforeinfoの直後: 当日全オッズ取得 (2/3: JCD 09〜16) ────────
  scrape_odds_b:
    needs: scrape_beforeinfo
    if: >-
      github.event.schedule == '0 22 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_date == '')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: 当日全オッズ取得 (JCD 09〜16)
        env:
          API_PENDING: ${{ secrets.API_PENDING }}
          API_ODDS: ${{ secrets.API_URL_ODDS }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python scrape_odds_all.py --jcd-min 09 --jcd-max 16

  # ─── scrape_beforeinfoの直後: 当日全オッズ取得 (3/3: JCD 17〜24) ────────
  scrape_odds_c:
    needs: scrape_beforeinfo
    if: >-
      github.event.schedule == '0 22 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_date == '')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: 当日全オッズ取得 (JCD 17〜24)
        env:
          API_PENDING: ${{ secrets.API_PENDING }}
          API_ODDS: ${{ secrets.API_URL_ODDS }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python scrape_odds_all.py --jcd-min 17 --jcd-max 24

  # ─── 毎日14時: 当日全オッズ取得 2回目 (1/3: JCD 01〜08) ────────
  # 18-20時台のレースはオッズ最終更新が締切に間に合わないケースが構造的に
  # 多く(bad率90%超)、朝1回のみの取得では取りこぼしていたための追加分。
  # 朝のscrape_odds_a/b/cと同じ3並列分割構成。scrape_beforeinfoには依存しない。
  scrape_odds_evening_a:
    if: >-
      github.event.schedule == '0 5 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.test_evening_odds == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: 当日全オッズ取得 2回目 (JCD 01〜08)
        env:
          API_PENDING: ${{ secrets.API_PENDING }}
          API_ODDS: ${{ secrets.API_URL_ODDS }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python scrape_odds_all.py --jcd-min 01 --jcd-max 08

  # ─── 毎日14時: 当日全オッズ取得 2回目 (2/3: JCD 09〜16) ────────
  scrape_odds_evening_b:
    if: >-
      github.event.schedule == '0 5 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.test_evening_odds == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: 当日全オッズ取得 2回目 (JCD 09〜16)
        env:
          API_PENDING: ${{ secrets.API_PENDING }}
          API_ODDS: ${{ secrets.API_URL_ODDS }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python scrape_odds_all.py --jcd-min 09 --jcd-max 16

  # ─── 毎日14時: 当日全オッズ取得 2回目 (3/3: JCD 17〜24) ────────
  scrape_odds_evening_c:
    if: >-
      github.event.schedule == '0 5 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.test_evening_odds == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: 当日全オッズ取得 2回目 (JCD 17〜24)
        env:
          API_PENDING: ${{ secrets.API_PENDING }}
          API_ODDS: ${{ secrets.API_URL_ODDS }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python scrape_odds_all.py --jcd-min 17 --jcd-max 24

  # ─── 毎夜20時(前日分) / 毎夜21:30(当日分速報): 競走成績取得 ───────
  # workflow_dispatchで target_date を指定すると、その日の成績だけをリカバリできる。
  # 20:00バッチ: TARGET=前日 / 21:30バッチ: TARGET=当日 / 手動: inputs.target_date
  fetch_results:
    if: >-
      github.event.schedule == '0 11 * * *' ||
      github.event.schedule == '30 12 * * *' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get install -y p7zip-full
          pip install requests

      - name: 対象日を決定
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET="${{ github.event.inputs.target_date }}"
            echo "[手動] 指定日: $TARGET"
          elif [ "${{ github.event.schedule }}" = "30 12 * * *" ]; then
            TARGET=$(date +%Y-%m-%d)
            echo "[21:30速報バッチ] 当日分: $TARGET"
          else
            TARGET=$(date -d 'yesterday' +%Y-%m-%d)
            echo "[20:00前日バッチ] 前日分: $TARGET"
          fi
          echo "TARGET=$TARGET" >> $GITHUB_ENV

      # 結果取込み(import_results.php)は、この時点で既に存在する strategies
      # としか照合しないため、閲覧されなかったレースが的中速報に永久に
      # 反映されない問題があった。結果取込みの前に全レース分の戦略買い目を
      # 機械的に生成しておくことで、閲覧有無に関係なく網羅する。
      - name: 対象日の戦略買い目を事前生成
        run: |
          echo "対象日: $TARGET"
          python generate_strategies_for_date.py --date $TARGET

      - name: 競走成績取得
        env:
          API_URL: ${{ secrets.API_URL_RESULTS }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python download_results.py --start $TARGET --end $TARGET

      # [2026-08-27] v2(LR)本番昇格により api_v2_batch.php の呼び出しを廃止。
      # api_predict.php が直接 v2 モデルで predictions テーブルに書き込むため不要。

      # [2026-09-04] v3シャドウテスト(design_v3_model_20260903.md §4.2)。
      # predictions_v2テーブル(転用)のみに書き込み、本番predictions/strategiesには不干渉。
      # 集計特徴量は対象日より前のresultsのみ使用のためレース後実行でもリークなし。
      - name: v3シャドウ予測生成
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          curl -s --max-time 170 "https://2410049.moo.jp/api_v3_shadow.php?api_key=${API_KEY}&date=${TARGET}"
