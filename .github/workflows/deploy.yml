name: 艇王 ロリポップへFTPデプロイ

# 必要なGitHub Secrets:
#   FTP_HOST : ロリポップのFTPホスト名
#   FTP_USER : FTPユーザー名
#   FTP_PASS : FTPパスワード
#   CONFIG_PHP_CONTENT : 本番用config.phpの中身(gitignore対象のためSecretで管理)
# 設定場所: リポジトリの Settings > Secrets and variables > Actions

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Composerキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-

      - name: Composer install
        run: composer install --no-progress --prefer-dist

      - name: PHPUnit実行
        run: vendor/bin/phpunit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: config.php生成
        env:
          CONFIG_PHP_CONTENT: ${{ secrets.CONFIG_PHP_CONTENT }}
        run: printf '%s\n' "$CONFIG_PHP_CONTENT" > config.php

      - name: FTPデプロイ
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/*.py
            **/*.yml
            **/*.md
            composer.json
            composer.lock
            phpunit.xml
            vendor/**
            tests/**
            .phpunit.cache/**
